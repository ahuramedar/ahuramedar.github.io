<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="فروشگاه آنلاین قطعات و تجهیزات الکترونیکی" />
  <title>اهورا مدار</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <script>
    // Applied before Vue mounts so there is no flash of the wrong theme.
    (function () {
      try {
        var saved = localStorage.getItem('theme')
        var prefersDark =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        var isDark = saved ? saved === 'dark' : prefersDark
        if (isDark) document.documentElement.classList.add('dark')
      } catch (e) { }
    })()
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
